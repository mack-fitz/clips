name: fetch-inbox
on:
  push:
    paths: ['inbox/links.txt']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download linked videos
        run: |
          set -e
          mkdir -p inbox/videos
          while IFS='|' read -r name url; do
            [ -z "$name" ] && continue
            curl -sSL --fail -o "inbox/videos/$name" "$url"
            size=$(stat -c %s "inbox/videos/$name")
            if [ "$size" -gt 95000000 ]; then
              sudo apt-get -qq install -y ffmpeg >/dev/null 2>&1 || true
              ffmpeg -v error -y -i "inbox/videos/$name" -c:v libx264 -preset fast -b:v 4M -maxrate 5M -bufsize 8M -c:a aac -b:a 160k "inbox/videos/${name%.*}.mp4"
              rm -f "inbox/videos/$name"
            fi
          done < inbox/links.txt
          rm -f inbox/links.txt
          ls -la inbox/videos
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A inbox
          git commit -m "Fetch inbox videos" || exit 0
          git push
