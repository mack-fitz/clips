name: fetch-inbox
# Two ways in:
#  - inbox/want.txt: one Dropbox file name per line. Downloads the shared folder (link stored in
#    the DROPBOX_FOLDER_URL secret) and keeps only those files. Used by the background task.
#  - inbox/want_trials.txt: same, from the trial-reels folder (DROPBOX_TRIALS_URL), into inbox/trials/.
#  - inbox/links.txt: name|url lines (temporary links). Used from chat.
# Big files (>95 MB) arrive split byte-for-byte (<name>.partNN + <name>.sha256); rejoin with tools/rejoin.sh.
on:
  push:
    paths: ['inbox/links.txt', 'inbox/want.txt', 'inbox/want_trials.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        env:
          FOLDER_URL: ${{ secrets.DROPBOX_FOLDER_URL }}
          TRIALS_URL: ${{ secrets.DROPBOX_TRIALS_URL }}
        run: |
          set -e
          mkdir -p inbox/videos
          if [ -s inbox/want.txt ]; then
            if [ -z "$FOLDER_URL" ]; then echo "DROPBOX_FOLDER_URL secret missing" >> inbox/failed.txt; else
              url=$(echo "$FOLDER_URL" | sed -E 's/([?&])dl=0/\1dl=1/')
              case "$url" in *dl=1*) ;; *\?*) url="$url&dl=1";; *) url="$url?dl=1";; esac
              curl -sSL --fail --retry 3 -o /tmp/folder.zip "$url" || echo "FAILED folder download" >> inbox/failed.txt
              if [ -f /tmp/folder.zip ]; then
                mkdir -p /tmp/folder && unzip -qo /tmp/folder.zip -d /tmp/folder || true
                while IFS= read -r name; do
                  [ -z "$name" ] && continue
                  src=$(find /tmp/folder -type f -name "$name" | head -1)
                  if [ -n "$src" ]; then cp "$src" "inbox/videos/$name"; else echo "MISSING $name" >> inbox/failed.txt; fi
                done < inbox/want.txt
              fi
            fi
          fi
          rm -f inbox/want.txt
          if [ -s inbox/want_trials.txt ]; then
            mkdir -p inbox/trials
            if [ -z "$TRIALS_URL" ]; then echo "DROPBOX_TRIALS_URL secret missing" >> inbox/failed.txt; else
              url=$(echo "$TRIALS_URL" | sed -E 's/([?&])dl=0/\1dl=1/')
              case "$url" in *dl=1*) ;; *\?*) url="$url&dl=1";; *) url="$url?dl=1";; esac
              curl -sSL --fail --retry 3 -o /tmp/trials.zip "$url" || echo "FAILED trials folder download" >> inbox/failed.txt
              if [ -f /tmp/trials.zip ]; then
                mkdir -p /tmp/trials && unzip -qo /tmp/trials.zip -d /tmp/trials || true
                while IFS= read -r name; do
                  [ -z "$name" ] && continue
                  src=$(find /tmp/trials -type f -name "$name" | head -1)
                  if [ -n "$src" ]; then cp "$src" "inbox/trials/$name"; else echo "MISSING $name" >> inbox/failed.txt; fi
                done < inbox/want_trials.txt
              fi
            fi
          fi
          rm -f inbox/want_trials.txt
          if [ -s inbox/links.txt ]; then
            while IFS='|' read -r name url; do
              [ -z "$name" ] && continue
              curl -sSL --fail --retry 3 -o "inbox/videos/$name" "$url" || echo "FAILED $name" >> inbox/failed.txt
            done < inbox/links.txt
          fi
          rm -f inbox/links.txt
          # Quality rule (Oct 13): never re-encode here; originals stay untouched. Files over 95 MB
          # are split byte-for-byte into <name>.part00, .part01 ... with the sha256 in <name>.sha256.
          # Rejoin in the workspace with tools/rejoin.sh (cat the parts in order + verify sha256).
          for f in inbox/videos/* inbox/trials/*; do
            [ -f "$f" ] || continue
            size=$(stat -c %s "$f")
            if [ "$size" -gt 95000000 ]; then
              sha256sum "$f" | cut -d' ' -f1 > "$f.sha256"
              split -b 90000000 -d -a 2 "$f" "$f.part"
              rm -f "$f"
            fi
          done
          ls -la inbox/videos
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A inbox
          git commit -m "Fetch inbox videos" || exit 0
          git push
